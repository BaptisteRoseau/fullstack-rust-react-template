---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-dev

resources:
  - namespace.yaml
  - ../../base
  - ../../monitoring
  - ../../debug

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/instance: dev
      app.kubernetes.io/version: "0.0.0-0000000" # keep in sync with the image tags below

# Immutable tags only: a release is a one-line change here.
images:
  - name: app_backend
    newName: ghcr.io/example/app_backend
    newTag: "0.0.0-0000000" # replace with the released <version>-<short commit>
  - name: app_frontend
    newName: ghcr.io/example/app_frontend
    newTag: "0.0.0-0000000" # replace with the released <version>-<short commit>
  - name: app_postgres
    newName: ghcr.io/example/app_postgres
    newTag: "0.0.0-0000000" # replace with the released <version>-<short commit>
  - name: app_migration
    newName: ghcr.io/example/app_migration
    newTag: "0.0.0-0000000" # replace with the released <version>-<short commit>
  - name: app_homepage
    newName: ghcr.io/example/app_homepage
    newTag: "0.0.0-0000000" # replace with the released <version>-<short commit>
  - name: app_keycloak
    newName: ghcr.io/example/app_keycloak
    newTag: "0.0.0-0000000" # replace with the released <version>-<short commit>

replicas:
  - name: backend
    count: 1
  - name: frontend
    count: 1

patches:
  - path: backend/configmap.yaml
  - path: backend/deployment.yaml
  - path: frontend/ingress.yaml
  - path: homepage/configmap.yaml
  - path: keycloak/configmap.yaml
  - path: keycloak/ingress.yaml
  # A shared dev cluster scales by hand; autoscaling only hides capacity problems here.
  - target:
      kind: HorizontalPodAutoscaler
    patch: |
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: unused
      $patch: delete
