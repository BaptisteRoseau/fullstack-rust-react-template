---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity-provider
    app.kubernetes.io/part-of: fullstack-rust-react-template
data:
  # The database vendor is baked into app_keycloak at build time, so it is not
  # settable here. Health and metrics are baked too and repeated for visibility:
  # the values must stay identical to the ones the image was built with.
  KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
  KC_DB_USERNAME: keycloak
  KC_HEALTH_ENABLED: "true"
  KC_METRICS_ENABLED: "true"
  KC_CACHE: ispn
  KC_CACHE_STACK: kubernetes
  KC_HTTP_ENABLED: "true"
  KC_IMPORT: /opt/keycloak/data/import/realm-export.json
