---
# Documents the keys the keycloak component expects. Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity-provider
    app.kubernetes.io/part-of: fullstack-rust-react-template
type: Opaque
stringData:
  KC_DB_PASSWORD: ""
  # Read once, on the first start of an empty database, to create the master
  # realm admin. Drop both keys from the cluster secret and restart once that
  # admin exists: a permanent pair here is a standing root credential.
  KC_BOOTSTRAP_ADMIN_USERNAME: ""
  KC_BOOTSTRAP_ADMIN_PASSWORD: ""
