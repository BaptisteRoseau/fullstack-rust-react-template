---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - deployment.yaml
  - ingress.yaml
  - pdb.yaml
  - service.yaml
  - service-headless.yaml

# The realm definition stays a single source of truth shared with Docker Compose.
configMapGenerator:
  - name: keycloak-realm-import
    files:
      - ../../../configs/keycloak/import/realm-export.json
    options:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity-provider
        app.kubernetes.io/part-of: fullstack-rust-react-template
