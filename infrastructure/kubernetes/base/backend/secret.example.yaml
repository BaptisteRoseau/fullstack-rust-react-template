---
# Documents the keys the backend component expects. Never commit real values:
# the cluster's secret manager (External Secrets, Sealed Secrets, SOPS) provides them.
apiVersion: v1
kind: Secret
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: fullstack-rust-react-template
type: Opaque
stringData:
  DATABASE_PASSWORD: ""
  S3_PASSWORD: ""
  AUTHENTICATOR_CLIENT_SECRET: ""
