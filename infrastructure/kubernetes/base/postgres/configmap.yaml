---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fullstack-rust-react-template
data:
  POSTGRES_DB: application
  POSTGRES_USER: postgres
  READWRITE_USER: readwrite
  READONLY_USER: readonly
  # Keeps the cluster in a sub-directory of the mount point so the volume's
  # lost+found does not make initdb refuse an empty data directory.
  PGDATA: /var/lib/postgresql/data/pgdata
