---
# Documents the keys the postgres component expects. Never commit real values:
# the cluster's secret manager (External Secrets, Sealed Secrets, SOPS) provides them.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fullstack-rust-react-template
type: Opaque
stringData:
  POSTGRES_PASSWORD: ""
  READWRITE_PASSWORD: ""
  READONLY_PASSWORD: ""
