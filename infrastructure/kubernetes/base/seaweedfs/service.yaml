---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: fullstack-rust-react-template
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 8333
      targetPort: s3
      protocol: TCP
    - name: master
      port: 9333
      targetPort: master
      protocol: TCP
    - name: filer
      port: 8888
      targetPort: filer
      protocol: TCP
  selector:
    app.kubernetes.io/name: seaweedfs
