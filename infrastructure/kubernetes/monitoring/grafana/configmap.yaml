---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/part-of: fullstack-rust-react-template
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        # Prometheus runs on every node from the NixOS image, not in the cluster.
        url: http://prometheus.example.com:9090
        isDefault: true
