---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/part-of: fullstack-rust-react-template
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        # Prometheus runs on every node from the NixOS image, not in the cluster,
        # so the address comes from the pod environment rather than a Service.
        url: $__env{PROMETHEUS_URL}
        isDefault: true
