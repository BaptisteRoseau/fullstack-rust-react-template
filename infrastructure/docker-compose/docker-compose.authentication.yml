services:
  postgres_keycloak:
    image: postgres:15
    volumes:
      - postgres_keycloak:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    # `--import-realm` provisions the `app` realm (self-service registration + the
    # `webapp` confidential client) from the mounted import directory on first boot.
    command: start-dev --import-realm # Use 'start' for production with proper hostname/certs
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres_keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_BOOTSTRAP_ADMIN: admin
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_IMPORT: /opt/keycloak/data/import/realm-export.json
    ports:
      - "8090:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      - postgres_keycloak

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025" # SMTP server port
      - "8030:8025" # Web UI port

volumes:
  postgres_keycloak:
