---
# Contains the minimum required services to run the application.

services:
  postgres:
    image: app_postgres:latest
    build:
      context: ../..
      dockerfile: infrastructure/docker/app_postgres/Dockerfile
      tags: ["app_postgres:latest"]
    container_name: app_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      READWRITE_USER: ${POSTGRES_READWRITE_USER}
      READWRITE_PASSWORD: ${POSTGRES_READWRITE_PASSWORD}
      READONLY_USER: ${POSTGRES_READONLY_USER}
      READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD}
    networks:
      - net
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: on-failure
    volumes:
      - "postgres:/var/lib/postgresql/data"

  migrate:
    image: nxyt/sqlx-cli:latest
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - net
    container_name: app_sqlx
    command: sqlx migrate run
    volumes:
      - ../../crates/database/migrations/:/migrations
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE}?sslmode=disable"

  redis:
    image: redis:7-alpine
    container_name: app_redis
    networks:
      - net
    ports:
      - "${REDIS_PORT}:6379"
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: s3
    ports:
      - "${S3_PORT}:3900"
      - "3902:3902"
      - "${S3_ADMIN_PORT}:3903"
    volumes:
      - ../garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/tmp/meta
      - garage_data:/tmp/data
    command: ["/garage", "server"]
    restart: on-failure

networks:
  net:

volumes:
  postgres:
  garage_meta:
  garage_data:
