---
# Contains the release builds of the backend and frontend.

services:

    backend-release:
        image: localhost/app_backend:latest
        build:
            context: ../..
            dockerfile: infrastructure/docker/app_backend/Dockerfile.release
            tags:
                - "localhost/app_backend:latest"
        depends_on:
            migrate:
                condition: service_completed_successfully
        container_name: app_backend
        env_file:
            - ${GIT_ROOT:-../..}/.env
        environment:
            IP: 0.0.0.0
            PORT: 9876
            PROMETHEUS_IP: 0.0.0.0
            PROMETHEUS_PORT: 9100
            SWAGGER_UI_PATH: "/v1/docs/swagger-ui"
            SWAGGER_OPENAPI_PATH: "/v1/docs/openapi.json"
            DEBUG: true
            DATABASE_HOST: postgres
            DATABASE_PORT: 5432
            DATABASE_NAME: ${POSTGRES_DATABASE}
            DATABASE_USER: ${POSTGRES_READWRITE_USER}
            DATABASE_PASSWORD: ${POSTGRES_READWRITE_PASSWORD}
        networks:
            - net
        profiles: [release]
        ports:
            - "${BACKEND_PORT}:9876"
        restart: on-failure

    frontend-release:
        image: localhost/app_frontend:latest
        build:
            context: ../..
            dockerfile: infrastructure/docker/app_frontend/Dockerfile.release
            tags:
                - "localhost/app_frontend:latest"
        container_name: app_frontend
        environment:
            API_ROOT: ${API_ROOT}
        networks:
            - net
        profiles: [release]
        ports:
            - "${FRONTEND_PORT}:8080"
        restart: on-failure

networks:
    net:
