# Base of the jobs that run the Docker CLI: image builds and Compose checks.
.docker-cli:
  image: $DOCKER_CI_IMAGE
  needs:
    - job: ci-docker-image
      optional: true

# Script that logs in to the project registry, for the jobs reading or writing
# its images and build cache.
.registry-login:
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# Adds a Docker daemon, for jobs that start containers: the integration tests,
# the generated models and the Dockerfile check.
# Needs a runner allowed to start privileged containers, tagged privileged.
.docker-daemon:
  tags:
    - privileged
  services:
    - docker:${DOCKER_VERSION}-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

# Adds a rootless BuildKit daemon, for jobs that only build and push images.
# It runs unprivileged, but the runner must start services with unconfined
# seccomp and AppArmor profiles, see the README. buildx sends it the build
# context and the registry credentials of docker login.
.buildkit:
  extends: .docker-cli
  services:
    - name: moby/buildkit:v0.34.1-rootless
      alias: buildkitd
      command: ["--addr", "tcp://0.0.0.0:1234", "--oci-worker-no-process-sandbox"]
  before_script:
    - !reference [.registry-login, script]
    - docker buildx create --name buildkitd --driver remote --use tcp://buildkitd:1234
    - timeout 60 sh -c 'until docker buildx inspect --bootstrap >/dev/null 2>&1; do sleep 1; done'

# Base of the ci-<name>-image jobs.
# IMAGE is tagged with the hash of IMAGE_DIRECTORY by
# scripts/update_ci_image_tags.sh, which hashes the files the same way. The job
# fails when the tag no longer matches the files, builds nothing when the tag
# is already pushed, and builds and pushes it otherwise. Equal files give equal
# tags, so two branches never push different images under one tag.
# It runs before the CI images exist, so it uses the upstream Docker image,
# whose shell is sh.
.ci-image:
  extends: .buildkit
  image: docker:$DOCKER_VERSION
  stage: ci_images
  needs: []
  variables:
    IMAGE_DIRECTORY: ""
    IMAGE: ""
  rules:
    - !reference [.should-run-all-jobs, rules]
    - changes:
        paths:
          - infrastructure/docker/ci_*/**/*
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
  script:
    - HASH=$(find "$IMAGE_DIRECTORY" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)
    - |
      if [ "${IMAGE##*:}" != "$HASH" ]; then
        echo "$IMAGE_DIRECTORY hashes to $HASH, but $IMAGE is tagged ${IMAGE##*:}." >&2
        echo "Run ./scripts/update_ci_image_tags.sh and commit gitlab-ci.yml." >&2
        exit 1
      fi
      if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
        echo "$IMAGE is already pushed"
        exit 0
      fi
    - docker buildx build --push --file "$IMAGE_DIRECTORY/Dockerfile" --tag "$IMAGE" "$IMAGE_DIRECTORY"
