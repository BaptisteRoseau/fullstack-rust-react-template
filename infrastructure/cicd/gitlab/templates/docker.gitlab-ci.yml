# Needs a runner allowed to start privileged containers.
.docker-daemon:
  services:
    - docker:29.9.2-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

.docker:
  extends: .docker-daemon
  image: docker:29.9.2
  needs: []
  before_script:
    - apk add --no-cache bash

# Builds IMAGE_NAME from DOCKERFILE with the repository root as context, and
# pushes it to the project registry from the default branch and from tags only.
# A Dockerfile that copies from localhost/tmp_health_checker needs that image
# built first in the same daemon.
.docker-image:
  extends: .docker
  stage: build
  variables:
    IMAGE_NAME: ""
    DOCKERFILE: ""
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/$IMAGE_NAME"
    - |
      if grep -q "localhost/tmp_health_checker" "$DOCKERFILE"; then
        docker build --file infrastructure/docker/tmp_health_checker/Dockerfile --tag localhost/tmp_health_checker:latest .
      fi
    - docker build --file "$DOCKERFILE" --tag "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ] && [ -z "$CI_COMMIT_TAG" ]; then
        echo "Not on $CI_DEFAULT_BRANCH nor on a tag, the image is not pushed"
        exit 0
      fi
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$CI_COMMIT_TAG"
        docker push "$IMAGE:$CI_COMMIT_TAG"
      else
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi
