spec:
  inputs:
    job:
      description: Name of the job that extends the generated hidden job .<job>-changed-files.
      regex: ^[a-z0-9-]+$
    paths:
      description: GitLab glob of the files to lint, from the repository root. Braces list several, as in `{*.sh,hooks/*}`.
      default: "**/*"
    exclude:
      description: GitLab glob of the files to leave out of the lint. They still start the job.
      default: ""
    all_on_delete:
      description: Lint every matching file when the branch deleted or renamed a file.
      type: boolean
      default: false
    command:
      description: The command that receives the files to lint as arguments.
---
# Runs the command on the matching files the branch changed, see
# scripts/list_changed_files.sh, and passes when no file matches.
# The same glob starts the job and lists its files, so the two cannot drift.
# It sets no needs, so the needs of the image template it is combined with stay.
".$[[ inputs.job ]]-changed-files":
  stage: static_analysis
  variables:
    GIT_DEPTH: "0"
  rules:
    - !reference [.should-run-all-jobs, rules]
    - changes:
        paths:
          - "$[[ inputs.paths ]]"
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
  script:
    - LIST_OPTION=""
    - if $[[ inputs.all_on_delete ]]; then LIST_OPTION="--all-on-delete"; fi
    - >-
      $CI_PROJECT_DIR/scripts/list_changed_files.sh $LIST_OPTION
      --exclude "$[[ inputs.exclude ]]" "$[[ inputs.paths ]]" > $CI_PROJECT_DIR/changed_files.txt
    - |
      if [ ! -s "$CI_PROJECT_DIR/changed_files.txt" ]; then
        echo "No changed file matches '$[[ inputs.paths ]]', nothing to check"
        exit 0
      fi
    - cat $CI_PROJECT_DIR/changed_files.txt
    - $[[ inputs.command ]] $(cat $CI_PROJECT_DIR/changed_files.txt)
