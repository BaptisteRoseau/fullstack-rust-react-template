# Base of the Rust jobs, with the cargo registry cached.
# CARGO_HOME moves into the project directory, the only place GitLab caches.
# The cache key changes with Cargo.lock, so crates the lock file dropped leave
# the cache with it instead of piling up.
# The cargo binaries stay on the PATH of the image, under /usr/local/cargo/bin.
# The CI never rebuilds the same tree twice, so incremental compilation would
# only fill target/, and line tables are enough for a backtrace.
.rust:
  image: $RUST_CI_IMAGE
  stage: static_analysis
  needs:
    - job: ci-rust-image
      optional: true
  variables:
    CARGO_TERM_COLOR: always
    CARGO_HOME: $CI_PROJECT_DIR/.cache/cargo
    CARGO_INCREMENTAL: "0"
    CARGO_PROFILE_DEV_DEBUG: line-tables-only
  cache:
    - &cargo-cache
      key:
        prefix: cargo
        files:
          - Cargo.lock
      paths:
        - .cache/cargo/registry/index
        - .cache/cargo/registry/cache
        - .cache/cargo/git/db
        - .cache/cargo/advisory-db
      policy: $CACHE_POLICY
  rules:
    - !reference [.should-run-all-jobs, rules]
    - !reference [.rust-dependencies-changed, rules]
    - !reference [.database-migrations-changed, rules]
    - changes:
        paths:
          - "**/*.rs"
          - rustfmt.toml
        compare_to: refs/heads/$CI_DEFAULT_BRANCH

# Mixin for the jobs that compile the workspace. sccache stores what it
# compiles in the S3 bucket set by the SCCACHE_BUCKET, SCCACHE_ENDPOINT and
# AWS_* project variables, or in SCCACHE_DIR, cached per job, when no bucket is
# set. A cache list replaces the one of .rust, so the cargo cache comes back
# through its anchor: two jobs pushing one key must push the same paths.
.rust-sccache:
  variables:
    RUSTC_WRAPPER: sccache
    SCCACHE_DIR: $CI_PROJECT_DIR/.cache/sccache
    SCCACHE_CACHE_SIZE: 2G
  cache:
    - *cargo-cache
    - key: sccache-$CI_JOB_NAME
      paths:
        - .cache/sccache
      policy: $CACHE_POLICY
  after_script:
    - sccache --show-stats
