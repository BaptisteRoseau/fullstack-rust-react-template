# Base of the frontend jobs: runs in frontend/ with the dependencies installed.
# Bun keeps the packages it downloads in its install cache, which the GitLab
# cache restores, so bun install only links them into node_modules. The cache
# key changes with bun.lock, so dropped packages leave the cache with it.
.bun:
  image: $BUN_CI_IMAGE
  stage: static_analysis
  needs:
    - job: ci-bun-image
      optional: true
  variables:
    BUN_INSTALL_CACHE_DIR: $CI_PROJECT_DIR/.cache/bun
  cache:
    key:
      prefix: bun
      files:
        - frontend/bun.lock
    paths:
      - .cache/bun
    policy: $CACHE_POLICY
  rules:
    - !reference [.check-all-files, rules]
    - !reference [.frontend-changed, rules]
  before_script:
    - cd frontend
    - bun install --frozen-lockfile

# Base of the jobs that drive a browser: e2e tests and accessibility.
# The Playwright image ships the browsers and their system libraries.
.bun-playwright:
  extends: .bun
  image: $PLAYWRIGHT_CI_IMAGE
  stage: test
  needs:
    - job: ci-playwright-image
      optional: true
