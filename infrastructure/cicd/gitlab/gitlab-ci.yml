stages:
  - ci_images
  - static_analysis
  - test
  - build
  - dynamic_analysis

# The images the jobs run in, built from infrastructure/docker/ci_<name>. Bump a
# tag whenever its directory changes: the ci-images jobs fail until it is.
# CACHE_POLICY lets only the default branch write the caches, see the workflow.
variables:
  RUST_CI_IMAGE: $CI_REGISTRY_IMAGE/ci_rust:2
  BUN_CI_IMAGE: $CI_REGISTRY_IMAGE/ci_bun:1
  PLAYWRIGHT_CI_IMAGE: $CI_REGISTRY_IMAGE/ci_playwright:1
  TOOLS_CI_IMAGE: $CI_REGISTRY_IMAGE/ci_tools:1
  DOCKER_CI_IMAGE: $CI_REGISTRY_IMAGE/ci_docker:1
  BUILD_CACHE: $CI_REGISTRY_IMAGE/buildcache
  CACHE_POLICY: pull

# One pipeline per pushed commit. Merge request pipelines would run the same
# commit a second time, so they are never created.
# CHECK_ALL_FILES makes every job run on every file instead of on what the
# branch changed since it left the default branch.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        CHECK_ALL_FILES: "true"
        CACHE_POLICY: pull-push
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "schedule"
      variables:
        CHECK_ALL_FILES: "true"
    - changes:
        paths:
          - .gitlab-ci.yml
          - infrastructure/cicd/gitlab/**/*
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
      variables:
        CHECK_ALL_FILES: "true"
    - when: always

# A new commit on a branch cancels its older pipelines, but only those where no
# job with interruptible: false has started, which is the default of a job.
default:
  interruptible: true

include:
  - local: infrastructure/cicd/gitlab/rules/*.gitlab-ci.yml
  - local: infrastructure/cicd/gitlab/templates/*.gitlab-ci.yml
  - local: infrastructure/cicd/gitlab/jobs/*.gitlab-ci.yml
