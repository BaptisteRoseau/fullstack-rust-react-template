stages:
  - ci_images
  - static_analysis
  - test
  - build
  - dynamic_analysis

# The images the jobs run in, built from infrastructure/docker/ci_<name> and
# tagged with the hash of that directory. scripts/update_ci_image_tags.sh
# writes the tags: the ci-images jobs fail when one is stale.
# DOCKER_VERSION is the upstream Docker image of the daemon and CI image jobs.
# CACHE_POLICY lets only the default branch write the caches, see the workflow.
variables:
  RUST_CI_IMAGE: $CI_REGISTRY_IMAGE/ci_rust:7d30afb0266a
  BUN_CI_IMAGE: $CI_REGISTRY_IMAGE/ci_bun:0dd3759cd823
  PLAYWRIGHT_CI_IMAGE: $CI_REGISTRY_IMAGE/ci_playwright:a59277879464
  TOOLS_CI_IMAGE: $CI_REGISTRY_IMAGE/ci_tools:c2d0a743a885
  DOCKER_CI_IMAGE: $CI_REGISTRY_IMAGE/ci_docker:97ae0354d4e1
  DOCKER_VERSION: "29.9.2"
  BUILD_CACHE: $CI_REGISTRY_IMAGE/buildcache
  CACHE_POLICY: pull

# One pipeline per pushed commit. Merge request pipelines would run the same
# commit a second time, so they are never created.
# SHOULD_RUN_ALL_JOBS makes every job run on every file instead of on what the
# branch changed since it left the default branch.
# A new commit on a branch cancels the interruptible jobs of its older
# pipelines, which default makes every job.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        SHOULD_RUN_ALL_JOBS: "true"
        CACHE_POLICY: pull-push
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "schedule"
      variables:
        SHOULD_RUN_ALL_JOBS: "true"
    - changes:
        paths:
          - .gitlab-ci.yml
          - infrastructure/cicd/gitlab/**/*
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
      variables:
        SHOULD_RUN_ALL_JOBS: "true"
    - when: always

# A job is not interruptible by default, and would keep running once its
# pipeline is redundant.
default:
  interruptible: true

include:
  - local: infrastructure/cicd/gitlab/rules/*.gitlab-ci.yml
  - local: infrastructure/cicd/gitlab/templates/*.gitlab-ci.yml
  - local: infrastructure/cicd/gitlab/jobs/*.gitlab-ci.yml
