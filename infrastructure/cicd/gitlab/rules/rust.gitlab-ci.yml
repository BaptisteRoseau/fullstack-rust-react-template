# Crate manifests and the lock file: every Rust job, plus license and advisory
# checks, which look at nothing else.
.rust-dependencies-changed:
  rules:
    - changes:
        paths:
          - "**/Cargo.toml"
          - Cargo.lock
        compare_to: refs/heads/$CI_DEFAULT_BRANCH

# SQL migrations, which the tests run and the generated models come from.
.database-migrations-changed:
  rules:
    - changes:
        paths:
          - crates/database/migrations/**/*
        compare_to: refs/heads/$CI_DEFAULT_BRANCH

# Any file of the backend crates, Rust or not, for the backend image.
.crates-changed:
  rules:
    - changes:
        paths:
          - crates/**/*
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
