# The changes rules shared by several Rust jobs, see changes_rule.gitlab-ci.yml.
include:
  # .rust-dependencies-changed: crate manifests and the lock file. Every Rust
  # job, the backend image, the license and advisory checks and the dependency
  # updates.
  - local: infrastructure/cicd/gitlab/templates/inputs/changes_rule.gitlab-ci.yml
    inputs:
      name: rust-dependencies
      paths: ["**/Cargo.toml", "Cargo.lock"]
  # .database-migrations-changed: the SQL migrations, which the tests run, the
  # migration image ships and the generated models come from.
  - local: infrastructure/cicd/gitlab/templates/inputs/changes_rule.gitlab-ci.yml
    inputs:
      name: database-migrations
      paths: ["crates/database/migrations/**/*"]
