# Matches every job on a full run: default branch, tags, schedules, CI changes.
# Listed first in every job, so it wins over the changes rules after it.
.check-all-files:
  rules:
    - if: $CHECK_ALL_FILES == "true"

# For checks that read every file type, such as typos and markdown links.
.any-file-changed:
  rules:
    - changes:
        paths:
          - "**/*"
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
