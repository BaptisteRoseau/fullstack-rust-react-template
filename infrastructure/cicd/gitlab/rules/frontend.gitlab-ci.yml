# The changes rules shared by several frontend jobs, see changes_rule.gitlab-ci.yml.
include:
  # .frontend-changed: anything under frontend/, sources, config and lock file.
  # Default of the .bun jobs, and the frontend image.
  - local: infrastructure/cicd/gitlab/templates/inputs/changes_rule.gitlab-ci.yml
    inputs:
      name: frontend
      paths: ["frontend/**/*"]
  # .frontend-src-changed: the application sources only, for the checks that
  # ignore the tooling config: i18n catalogs and accessibility.
  - local: infrastructure/cicd/gitlab/templates/inputs/changes_rule.gitlab-ci.yml
    inputs:
      name: frontend-src
      paths: ["frontend/src/**/*"]
  # .frontend-dependencies-changed: the npm dependencies, for the license and
  # advisory checks, the Storybook build and the dependency updates.
  - local: infrastructure/cicd/gitlab/templates/inputs/changes_rule.gitlab-ci.yml
    inputs:
      name: frontend-dependencies
      paths: ["frontend/package.json", "frontend/bun.lock"]
