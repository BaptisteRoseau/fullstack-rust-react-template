include:
  - local: infrastructure/cicd/gitlab/templates/inputs/lint_changed_files.gitlab-ci.yml
    inputs:
      job: hadolint
      paths: "**/Dockerfile*"
      command: hadolint
  - local: infrastructure/cicd/gitlab/templates/inputs/lint_changed_files.gitlab-ci.yml
    inputs:
      job: shellcheck
      paths: "{**/*.sh,scripts/git_hooks/pre-push}"
      command: shellcheck
  - local: infrastructure/cicd/gitlab/templates/inputs/lint_changed_files.gitlab-ci.yml
    inputs:
      job: yamllint
      paths: "**/*.{yml,yaml}"
      command: yamllint
  - local: infrastructure/cicd/gitlab/templates/inputs/lint_changed_files.gitlab-ci.yml
    inputs:
      job: gitlab-ci
      paths: "{.gitlab-ci.yml,infrastructure/cicd/gitlab/**/*.yml}"
      command: ./scripts/test_lint_cicd.sh

# docker build --check over every Dockerfile.
# The release Dockerfiles copy from localhost/tmp_health_checker, so that image
# is loaded in the daemon first, mostly from the registry cache. The daemon
# uses the containerd image store, the default since Docker 29, which lets the
# default builder export a registry cache.
dockerfiles:
  extends:
    - .docker-cli
    - .docker-daemon
  stage: static_analysis
  rules:
    - !reference [.should-run-all-jobs, rules]
    - !reference [.tmp-health-checker-image-changed, rules]
    - changes:
        paths:
          - infrastructure/docker/**/*
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
  script:
    - !reference [.registry-login, script]
    - |
      CACHE_TO=""
      if [ "$CACHE_POLICY" = pull-push ]; then
        CACHE_TO="--cache-to type=registry,ref=$BUILD_CACHE:tmp_health_checker,mode=max"
      fi
      docker buildx build --load \
        --cache-from "type=registry,ref=$BUILD_CACHE:tmp_health_checker" $CACHE_TO \
        --file infrastructure/docker/tmp_health_checker/Dockerfile \
        --tag localhost/tmp_health_checker:latest .
    - ./scripts/test_lint_infra.sh docker

# hadolint over the changed Dockerfiles.
hadolint:
  extends:
    - .tools
    - .hadolint-changed-files

# Merges the Compose manifests with every profile.
# docker compose config reads the manifests only, no daemon is needed.
docker-compose:
  extends: .docker-cli
  stage: static_analysis
  rules:
    - !reference [.should-run-all-jobs, rules]
    - !reference [.infrastructure-configs-changed, rules]
    - changes:
        paths:
          - docker-compose.yml
          - infrastructure/docker-compose/**/*
          - .env.dev
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
  script:
    - ln -sf .env.dev .env
    - ./scripts/test_lint_infra.sh compose

# Builds the Kustomize overlays and validates them with kubeconform.
kubernetes:
  extends: .tools
  rules:
    - !reference [.should-run-all-jobs, rules]
    - !reference [.infrastructure-configs-changed, rules]
    - changes:
        paths:
          - infrastructure/kubernetes/**/*
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
  script:
    - ./scripts/test_lint_infra.sh kubernetes

# Formatting, lints and evaluation of every Nix file, in the flake's shell.
nix:
  image: nixos/nix:2.35.4
  stage: static_analysis
  needs: []
  variables:
    NIX_CONFIG: "experimental-features = nix-command flakes"
  rules:
    - !reference [.should-run-all-jobs, rules]
    - changes:
        paths:
          - "**/*.nix"
          - flake.lock
          - infrastructure/nix/**/*
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
  script:
    - nix develop --command ./scripts/test_lint_nix.sh

# shellcheck over the changed shell scripts.
shellcheck:
  extends:
    - .tools
    - .shellcheck-changed-files

# yamllint over the changed YAML files. Reports only.
yamllint:
  extends:
    - .tools
    - .yamllint-changed-files
  allow_failure: true

# The changed CI manifests against GitLab's CI schema, and the CI image tags
# against their directories.
gitlab-ci:
  extends:
    - .tools
    - .gitlab-ci-changed-files
