# rustfmt over the workspace.
rust-format:
  extends: .rust
  script:
    - cargo fmt --all --check

# Clippy, rustdoc with warnings as errors, and the check without default
# features.
# Clippy, rustdoc and the check without default features all compile in check
# mode, so in one job they share the compiled dependencies.
rust-check:
  extends:
    - .rust
    - .rust-sccache
  variables:
    RUSTDOCFLAGS: "-D warnings"
  script:
    - ./scripts/test_lint_backend.sh
    - cargo doc --workspace --all-features --no-deps

# Every Rust test, the coverage report and the OpenAPI document.
# Runs every test once, doctests and the tests under tests/ included, in the
# build cargo-llvm-cov instruments for the coverage report. The tests under
# tests/ start their backends with testcontainers.
# The OpenAPI document reuses that build, and openapi-sdk checks it, so this
# job also runs when only the generated SDK or its generator changed: an SDK
# edited by hand is then checked against the router.
rust-tests:
  extends:
    - .rust
    - .rust-sccache
    - .docker-daemon
  stage: test
  variables:
    TESTCONTAINERS_HOST_OVERRIDE: docker
  rules:
    - !reference [.rust, rules]
    - changes:
        paths:
          - frontend/src/api/generated/**/*
          - frontend/scripts/generateApiSdk.ts
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
  script:
    - source <(cargo llvm-cov show-env --sh)
    - cargo llvm-cov clean --workspace
    - cargo test --workspace --all-features
    - cargo llvm-cov report --ignore-filename-regex='crates/(models/|logging)' --cobertura --output-path rust-coverage.xml
    - ./scripts/build_openapi.sh
    - mv openapi.json frontend/openapi.json
  artifacts:
    paths:
      - frontend/openapi.json
    expire_in: 1 day
    reports:
      coverage_report:
        coverage_format: cobertura
        path: rust-coverage.xml

# Fails on a crate whose license deny.toml does not allow.
rust-licenses:
  extends: .rust
  rules:
    - !reference [.should-run-all-jobs, rules]
    - !reference [.rust-dependencies-changed, rules]
    - changes:
        paths:
          - deny.toml
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
  script:
    - ./scripts/test_licenses.sh backend

# Reports the known vulnerabilities of the crates, without failing.
rust-advisories:
  extends: .rust
  allow_failure: true
  rules:
    - !reference [.should-run-all-jobs, rules]
    - !reference [.rust-dependencies-changed, rules]
  script:
    - ./scripts/test_cve.sh backend

# Reports dependencies no crate uses, without failing.
rust-unused-dependencies:
  extends: .rust
  allow_failure: true
  script:
    - cargo machete

# Fails when crates/database/src/generated_models.rs is out of date.
# Regenerates the models from a blank database and fails when the committed
# file differs. The database container publishes its port on the dind service.
# The database image builds from the layers app-postgres-image cached.
rust-generated-models:
  extends:
    - .rust
    - .docker-daemon
  stage: test
  variables:
    POSTGRES_HOST: docker
  rules:
    - !reference [.should-run-all-jobs, rules]
    - !reference [.database-migrations-changed, rules]
    - !reference [.postgres-image-changed, rules]
    - changes:
        paths:
          - crates/database/src/generated_models.rs
          - scripts/build_database_rust_models.sh
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
  script:
    - !reference [.registry-login, script]
    - >-
      docker buildx build --load
      --cache-from "type=registry,ref=$BUILD_CACHE:app_postgres"
      --file infrastructure/docker/app_postgres/Dockerfile --tag app_postgres:latest .
    - ln -sf .env.dev .env
    - ./scripts/build_database_rust_models.sh
    - git diff --exit-code -- crates/database/src/generated_models.rs
