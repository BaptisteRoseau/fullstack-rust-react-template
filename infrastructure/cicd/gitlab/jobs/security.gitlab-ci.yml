# GitLab's scanners, from its templates: secrets, SAST, infrastructure as code
# and dependencies over the sources, CVEs in the pushed images. Dependency
# scanning reads Cargo.lock and bun.lock, and needs GitLab 19.0 or later.
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

# The templates leave a branch with an open merge request to its merge request
# pipeline, which the workflow never creates. Dependency scanning does so even
# when this variable is unset, so it is set to keep every scan in the branch
# pipeline.
variables:
  AST_ENABLE_MR_PIPELINES: "false"

# The bases of the source scanners. Without needs, a job waits for every
# earlier stage and is skipped when one fails, so a failing lint would leave
# the commit unscanned. These keys merge into the templates' own.
sast:
  needs: []

.secret-analyzer:
  needs: []

iac-sast:
  needs: []

dependency-scanning:
  needs: []

# The base of the <job>-scan jobs that docker_image.gitlab-ci.yml generates,
# one per release image. It has no image of its own to scan.
container_scanning:
  rules:
    - when: never
