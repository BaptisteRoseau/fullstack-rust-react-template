include:
  - local: infrastructure/cicd/gitlab/templates/inputs/lint_changed_files.gitlab-ci.yml
    inputs:
      job: markdown
      paths: "**/*.md"
      exclude: ".agents/skills/api-*/**"
      all_on_delete: true
      command: ./scripts/test_lint_doc.sh
  - local: infrastructure/cicd/gitlab/templates/inputs/lint_changed_files.gitlab-ci.yml
    inputs:
      job: typos
      command: typos --force-exclude
  - local: infrastructure/cicd/gitlab/templates/inputs/lint_changed_files.gitlab-ci.yml
    inputs:
      job: cspell
      command: cspell --no-progress --no-must-find-files --config .cspell.yml

# markdownlint and the link check over the changed markdown files, or over all
# of them when a file was deleted or renamed, since that can break a link.
# Any changed file can be such a deletion, so any one starts the job.
markdown:
  extends:
    - .tools
    - .markdown-changed-files
  rules:
    - !reference [.should-run-all-jobs, rules]
    - changes:
        paths:
          - "**/*"
        compare_to: refs/heads/$CI_DEFAULT_BRANCH

# Spelling mistakes in every changed file, code included.
typos:
  extends:
    - .tools
    - .typos-changed-files

# Unknown words in every changed file, against .cspell.yml. Reports only.
cspell:
  extends:
    - .tools
    - .cspell-changed-files
  allow_failure: true
