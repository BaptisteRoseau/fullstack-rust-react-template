[package]
name = "database"
version = "0.1.0"
edition = "2024"
# Every test binary is declared below; without this cargo would also pick up
# `tests/trait_tests.rs`, which is the shared suite and not a target of its own.
autotests = false

[lints.clippy]
# `database::database` (src/database/mod.rs) intentionally names the module
# after the crate/directory to match the `Database` trait it defines.
module_inception = "allow"

[dependencies]
database_crud_derive = { path = "../database_crud_derive" }
logging = { path = "../logging" }
config = { path = "../config" }
chrono = { version = "*" }
serde_json = "1"
sqlx = { version = "0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
metrics = { version = "0" }
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
uuid = { version = "1", features = ["fast-rng", "serde", "v7"] }
thiserror = "2"
tracing = { version = "0", features = ["async-await"] }

[features]
postgres = []
test-utils = []

[dev-dependencies]
test_trait = { path = "../test_trait" }
testcontainers = "0.24"
testcontainers-modules = { version = "0.12", features = ["postgres"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "fast-rng"] }

[[test]]
name = "postgres"
path = "tests/backends/postgres.rs"
harness = false
required-features = ["postgres"]

[[test]]
name = "mock"
path = "tests/backends/mock.rs"
harness = false
required-features = ["test-utils"]
