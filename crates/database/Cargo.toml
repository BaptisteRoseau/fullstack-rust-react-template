[package]
name = "database"
version = "0.1.0"
edition = "2024"

[dependencies]
database_crud_derive = { path = "../database_crud_derive" }
logging = { path = "../logging" }
config = { path = "../config" }
chrono = { version = "*" }
serde_json = "1"
sqlx = { version = "0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
metrics = { version = "0" }
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
uuid = { version = "1", features = ["fast-rng", "serde", "v7"] }
thiserror = "2"
tracing = { version = "0", features = ["async-await"] }

[features]
# In-memory `Database` test double (`database::testing::MockDatabase`), for
# downstream crates' unit/integration tests. Enable via [dev-dependencies].
test-utils = []

[dev-dependencies]
test_trait = { path = "../test_trait" }
testcontainers = "0.24"
testcontainers-modules = { version = "0.12", features = ["postgres"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "fast-rng"] }

[[test]]
name = "postgres"
path = "tests/common/mod.rs"
harness = false

[[test]]
name = "mock"
path = "tests/mock.rs"
harness = false
# `MockDatabase` is feature-gated out of the plain lib build, and an integration
# test links this crate the way a downstream consumer does. So this binary only
# builds under `--all-features` (or `--features test-utils`), which is what
# `scripts/test_units.sh` and `scripts/test_lint.sh` pass; a bare
# `cargo test -p database` silently skips it.
required-features = ["test-utils"]
