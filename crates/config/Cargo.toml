[package]
name = "config"
version = "0.1.0"
edition = "2024"

[dependencies]
test_utils = { path = "../test_utils" }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0"
serde = { version = "1", features = ["derive"] }
serde_yaml = "*"
thiserror = "2"

[features]
# Ready-made `Config` for downstream crates' tests. Enable via [dev-dependencies].
test-utils = []
