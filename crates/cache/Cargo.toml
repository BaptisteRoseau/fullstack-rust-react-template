[package]
name = "cache"
version = "0.1.0"
edition = "2024"
# Every test binary is declared below; without this cargo would also pick up
# `tests/trait_tests.rs`, which is the shared suite and not a target of its own.
autotests = false

[dependencies]
logging = { path = "../logging" }
config = { path = "../config" }
async-trait = "0"
deadpool-redis = "0"
thiserror = "2"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
test_trait = { path = "../test_trait" }
testcontainers = "0.24"
testcontainers-modules = { version = "0.12", features = ["redis"] }
serde = { version = "1", features = ["derive"] }
# `macros` for `#[tokio::test]`, `time` for the expiry tests' sleep.
tokio = { version = "1", features = ["rt", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }

[[test]]
name = "redis"
path = "tests/backends/redis.rs"
harness = false

[[test]]
name = "hash_map"
path = "tests/backends/hash_map.rs"
harness = false
