[package]
name = "storage"
version = "0.1.0"
edition = "2024"
# Every test binary is declared below; without this cargo would also pick up
# `tests/trait_tests.rs`, which is the shared suite and not a target of its own.
autotests = false

[dependencies]
logging = { path = "../logging" }
config = { path = "../config" }
compressor = { path = "../compressor" }
flate2 = "1"
async-trait = "0"
libcaesium = { version = "0", features = ["gif", "jpg", "png", "tiff", "webp"] }
s3 = { version = "0", features = ["checksums", "metrics"] }
# reqx 0.1.29 added a `message` field to Error::Transport that breaks s3 0.1.22
reqx = ">=0.1.27, <0.1.29"
thiserror = "2"

[features]
# Each backend under `src/backends` is opt-in; enable the ones you need.
s3 = []

[dev-dependencies]
test_trait = { path = "../test_trait" }
testcontainers = "0.24"
uuid = { version = "1", features = ["v4"] }

[[test]]
name = "s3"
path = "tests/backends/s3.rs"
harness = false
required-features = ["s3"]
